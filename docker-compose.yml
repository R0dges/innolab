# Juryza — one command to a seeded, working portal.
#
#   docker compose up
#
# Brings up Postgres and the portal, applies pending migrations, seeds the
# DOGFOOD fixtures plus a live sandbox event, writes .dogfood.toml back to this
# directory, and serves the portal at http://localhost:8080. Runs offline at
# runtime — no cloud account, hosted database, or external API is required.
#
# Reseed from scratch:   SEED_RESET=1 docker compose up
# Add real-world demo:   SEED_SHOWCASE=1 SEED_RESET=1 docker compose up
# Wipe everything:       docker compose down -v

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: juryza
      POSTGRES_PASSWORD: juryza
      POSTGRES_DB: juryza
    # Keep local development access on this machine only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 places data in a subdirectory of /var/lib/postgresql, so
      # the mount sits one level up (see docker-library/postgres#37).
      - juryza-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juryza -d juryza"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal:
    build:
      context: .
      dockerfile: apps/juryza/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://juryza:juryza@db:5432/juryza
      BETTER_AUTH_SECRET: dogfood-2026-dev-secret-please-rotate-in-prod
      BETTER_AUTH_URL: http://localhost:8080
      PORTAL_BASE_URL: http://localhost:8080
      # Where the seed writes the generated .dogfood.toml (mounted below).
      DOGFOOD_TOML_PATH: /repo/.dogfood.toml
      FIXTURES_PATH: /repo/fixtures.json
      NODE_ENV: production
      # Set to 1 to wipe and reseed the database on start.
      SEED_RESET: ${SEED_RESET:-0}
      # Set to 1 to also seed the Hackathon Raptors real-world showcase events
      SEED_SHOWCASE: ${SEED_SHOWCASE:-0}
    ports:
      - "${PORTAL_BIND_ADDRESS:-0.0.0.0}:${PORTAL_PORT:-8080}:8080"
    volumes:
      # Share fixtures in and the generated .dogfood.toml out with the host, so
      # `python3 run.py .dogfood.toml` works from the repo root after boot.
      - ./fixtures.json:/repo/fixtures.json:ro
      - ./.dogfood.toml:/repo/.dogfood.toml
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  juryza-db:
